name: apply.yml
on:
  push:
    branches:
      - main

jobs:
  apply:
    name: Terraform Apply
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup terraform
        uses: hashicorp/setup-terraform@v4

      - name: Manage tfstate with MongoDB
        uses: tsuji-riya/tfstate-loves-mongo@v1.2.3
        with:
          mongo-uri: ${{ secrets.MONGO_URI }}
          database: tfstate
          collection: vartemplate
          destination: ./terraform.tfstate

      - name: terraform init
        run: terraform init

      - name: terraform apply
        run: terraform apply -input=false -auto-approve
        env:
          TF_VAR_app_pem_file: ${{ secrets.TF_VAR_app_pem_file }}