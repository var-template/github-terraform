name: plan.yml
on:
  pull_request:
    branches: ["*"]

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup terraform
        uses: hashicorp/setup-terraform@v4

      - name: Manage tfstate with MongoDB
        uses: tsuji-riya/tfstate-loves-mongo@v1.2.3
        with:
          mongo-uri: ${{ secrets.MONGO_URI }}
          database: tfstate
          collection: vartemplate
          destination: ./terraform.tfstate

      - name: terraform init
        run: terraform init

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform validate
        run: terraform validate -no-color

      - name: terraform plan
        run: terraform plan -input=false -no-color
        env:
          TF_VAR_app_pem_file: ${{ secrets.TF_VAR_app_pem_file }}
